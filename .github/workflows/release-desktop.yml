name: Release desktop app

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mac-arm64:
    runs-on: macos-15 # Apple Silicon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
      - name: The tag matches the app version
        run: test "v$(node -p 'require("./desktop/package.json").version')" = "$GITHUB_REF_NAME"
      - name: Check and test the daemon
        run: npm ci && npm run check && npm test
      - name: Build and publish the app
        working-directory: desktop
        run: npm ci && npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
